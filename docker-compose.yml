version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: taskmanager-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: taskmanager-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://shuklaharsh1530_db_user:xKhPONPB4mzic7AI@cluster0.cgzjazx.mongodb.net/taskmanager?retryWrites=true&w=majority&appName=Cluster0

      - JWT_SECRET=supersecretjwtkey2024taskmanager
      - JWT_EXPIRE=7d
      - NODE_ENV=production
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: taskmanager-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads_data:
